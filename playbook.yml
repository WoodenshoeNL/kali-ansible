# kali-ansible/playbook.yml
- hosts: all
  gather_facts: yes
  become: true

  roles:
    - Common
    - Web
    - Cloud
    - AD
    - SCCM
    - Network
    - OSINT
    - Extra
    # Opt-in: -e install_ghidra=true (and install_ghidra_vms=true for the KVM lab).
    - role: Ghidra
      when: install_ghidra | default(false) | bool
