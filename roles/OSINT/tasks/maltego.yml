
- name: Install Maltego CE from Kali repos
  ansible.builtin.apt:
    name: maltego
    state: present
    update_cache: yes
  when: vmware_env != "ubuntu"
  tags:
    - maltego
    - osint

# Latest v4 .deb resolved from the downloads directory listing at runtime,
# so the version pin doesn't go stale (v4.7.0 was the previous hard pin).
- name: Maltego - Find latest v4 .deb filename (Ubuntu)
  ansible.builtin.uri:
    url: https://downloads.maltego.com/maltego-v4/linux/
    return_content: yes
  register: maltego_listing
  when: vmware_env == "ubuntu"
  tags:
    - maltego
    - osint

- name: Maltego - Set latest .deb URL fact (Ubuntu)
  ansible.builtin.set_fact:
    maltego_deb_url: "https://downloads.maltego.com/maltego-v4/linux/{{ (maltego_listing.content | regex_findall('Maltego[.]v4[.][0-9.]+[.]deb') | unique | version_sort | last) }}"
  when: vmware_env == "ubuntu"
  tags:
    - maltego
    - osint

- name: Download Maltego CE for Ubuntu (latest)
  ansible.builtin.get_url:
    url: "{{ maltego_deb_url }}"
    dest: "/tmp/maltego.deb"
    mode: '0644'
  when: vmware_env == "ubuntu"
  tags:
    - maltego
    - osint

- name: Install Maltego CE dependencies (Ubuntu)
  ansible.builtin.apt:
    name:
      - default-jre
      - libxcb-cursor0
    state: present
    update_cache: yes
  when: vmware_env == "ubuntu"
  tags:
    - maltego
    - osint

- name: Install Maltego CE from .deb (Ubuntu)
  ansible.builtin.apt:
    deb: "/tmp/maltego.deb"
    state: present
  when: vmware_env == "ubuntu"
  tags:
    - maltego
    - osint

- name: Clean up Maltego .deb installer
  ansible.builtin.file:
    path: "/tmp/maltego.deb"
    state: absent
  when: vmware_env == "ubuntu"
  tags:
    - maltego
    - osint


