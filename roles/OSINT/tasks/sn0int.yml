# sn0int OSINT tool installation
# Kali Linux and Ubuntu compatible

# === Common prerequisite packages ===
- name: sn0int - ensure prerequisite packages are present
  apt:
    name:
      - curl
      - gnupg
    state: present
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - sn0int
    - OSINT

# === Kali Linux installation ===
# Kali packages sn0int itself (0.26.1-0kali1, newer than kpcyrd's 0.25.0), so
# the third-party repo is not added on Kali any more. Its key was saved
# ASCII-armored under a .gpg name, which current apt (sqv) may refuse; clean
# up what older runs left behind.
- name: sn0int - remove third-party repo and key left by older runs (Kali)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/share/keyrings/apt-vulns-sexy.gpg
    - /etc/apt/sources.list.d/apt-vulns-sexy.list
  when: vmware_env != "ubuntu"
  tags:
    - sn0int
    - OSINT

# === Ubuntu installation ===
- name: sn0int - remove stale apt.vulns.sexy keyring (Ubuntu)
  file:
    path: /usr/share/keyrings/apt-vulns-sexy.gpg
    state: absent
  when: vmware_env == "ubuntu"
  tags:
    - sn0int
    - OSINT

- name: sn0int - find stale vulns repo configs (Ubuntu)
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "*vulns*"
  register: sn0int_stale_repos
  when: vmware_env == "ubuntu"
  tags:
    - sn0int
    - OSINT

- name: sn0int - remove stale vulns repo configs (Ubuntu)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ sn0int_stale_repos.files | default([]) }}"
  when: vmware_env == "ubuntu"
  tags:
    - sn0int
    - OSINT

- name: sn0int - download and dearmor signing key (Ubuntu)
  shell: |
    curl -fsSL https://apt.vulns.xyz/kpcyrd.pgp | gpg --dearmor -o /usr/share/keyrings/apt-vulns-sexy.gpg
    chmod 644 /usr/share/keyrings/apt-vulns-sexy.gpg
  when: vmware_env == "ubuntu"
  tags:
    - sn0int
    - OSINT

- name: sn0int - add apt repository (Ubuntu)
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/apt-vulns-sexy.gpg] https://apt.vulns.xyz stable main"
    filename: apt-vulns-sexy
    state: present
  when: vmware_env == "ubuntu"
  tags:
    - sn0int
    - OSINT

# === Common installation ===
- name: sn0int - install package
  apt:
    name: sn0int
    state: latest
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - sn0int
    - OSINT