# sn0int OSINT tool installation
# Kali Linux and Ubuntu compatible

# === Common prerequisite packages ===
- name: sn0int - ensure prerequisite packages are present
  apt:
    name:
      - curl
      - gnupg
    state: present
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - sn0int
    - OSINT

# === Kali Linux installation ===
# Kali packages sn0int itself (0.26.1-0kali1, newer than kpcyrd's 0.25.0), so
# the third-party repo is not added on Kali any more. Its key was saved
# ASCII-armored under a .gpg name, which current apt (sqv) may refuse; clean
# up what older runs left behind.
- name: sn0int - remove third-party repo and key left by older runs (Kali)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/share/keyrings/apt-vulns-sexy.gpg
    - /etc/apt/sources.list.d/apt-vulns-sexy.list
  when: vmware_env != "ubuntu"
  tags:
    - sn0int
    - OSINT

# === Ubuntu installation ===
# kpcyrd's repo (apt.vulns.sexy now redirects to apt.vulns.xyz). Every step
# only changes something when it differs, so a re-run reports ok: the old
# version deleted key and repo file and recreated them on every run.
- name: sn0int - remove other vulns repo files from older runs (Ubuntu)
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "*vulns*"
    excludes: "apt-vulns-sexy.list"
  register: sn0int_stale_repos
  when: vmware_env == "ubuntu"
  tags:
    - sn0int
    - OSINT

- name: sn0int - delete them (Ubuntu)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ sn0int_stale_repos.files | default([]) }}"
  when: vmware_env == "ubuntu"
  tags:
    - sn0int
    - OSINT

- name: sn0int - install signing key when it changed (Ubuntu)
  ansible.builtin.shell: |
    set -eo pipefail
    tmp=$(mktemp); trap 'rm -f "$tmp"' EXIT
    curl -fsSL https://apt.vulns.xyz/kpcyrd.pgp | gpg --batch --yes --dearmor -o "$tmp"
    if ! cmp -s "$tmp" /usr/share/keyrings/apt-vulns-sexy.gpg; then
      install -m 0644 "$tmp" /usr/share/keyrings/apt-vulns-sexy.gpg; echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: sn0int_key
  changed_when: "'CHANGED' in sn0int_key.stdout"
  when: vmware_env == "ubuntu"
  tags:
    - sn0int
    - OSINT

# copy, not apt_repository: the file holds exactly this one line, so an old
# apt.vulns.sexy line from earlier runs is replaced rather than kept beside it.
- name: sn0int - apt repository (Ubuntu)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/apt-vulns-sexy.list
    content: "deb [signed-by=/usr/share/keyrings/apt-vulns-sexy.gpg] https://apt.vulns.xyz stable main\n"
    mode: "0644"
  when: vmware_env == "ubuntu"
  tags:
    - sn0int
    - OSINT

# === Common installation ===
- name: sn0int - install package
  apt:
    name: sn0int
    state: latest
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - sn0int
    - OSINT