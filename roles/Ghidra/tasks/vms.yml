# Windows lab VM stack (KVM/libvirt) + snapshot helper. Only runs with
# install_ghidra_vms=true (see defaults/main.yml).
# The win11-lab VM itself (UEFI/TPM/virtio, ISO attach) is defined manually
# once via virt-install; its notes (BUGHUNT-LAB.md on RAPIER) are not in this
# repo. This file only provisions the virtualization stack and vm-lab.sh.

- name: VMs - Install KVM/libvirt/virt-manager stack
  ansible.builtin.apt:
    name:
      - qemu-system-x86   # provides qemu-kvm, which is only a virtual package on Kali
      - libvirt-daemon-system
      - libvirt-clients
      - virt-manager
      - bridge-utils
      - swtpm
      - ovmf
    state: present
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - ghidra-vms

- name: VMs - Add user to libvirt and kvm groups
  ansible.builtin.user:
    name: "{{ login_user }}"
    groups: libvirt,kvm
    append: yes
  tags:
    - ghidra-vms

- name: VMs - Enable and start libvirtd
  ansible.builtin.systemd:
    name: libvirtd
    enabled: yes
    state: started
  tags:
    - ghidra-vms

- name: VMs - Autostart default NAT network
  ansible.builtin.command:
    argv:
      - virsh
      - net-autostart
      - default
  changed_when: false
  tags:
    - ghidra-vms

- name: VMs - Create ~/vms
  ansible.builtin.file:
    path: "{{ login_home }}/vms"
    state: directory
    owner: "{{ login_user }}"
    group: "{{ login_user }}"
    mode: "0755"
  tags:
    - ghidra-vms

- name: VMs - Deploy vm-lab.sh snapshot helper
  ansible.builtin.copy:
    src: vm-lab.sh
    dest: "{{ login_home }}/vms/vm-lab.sh"
    owner: "{{ login_user }}"
    group: "{{ login_user }}"
    mode: "0755"
  tags:
    - ghidra-vms
