
- name: azurehound - Install azurehound packages
  apt:
    name:
      - azurehound
    state: present
    update_cache: yes
    cache_valid_time: 3600
  when: vmware_env != "ubuntu"
  tags:
    - azurehound
    - cloud

# The asset name carries the version (AzureHound_v3.1.3_linux_amd64.zip), so
# resolve the tag from the releases/latest redirect: unlike api.github.com it
# is not limited to 60 requests/hour per NAT. The repo moved to SpecterOps.
- name: azurehound - Resolve latest release tag
  ansible.builtin.shell: |
    set -euo pipefail
    url=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/SpecterOps/AzureHound/releases/latest)
    tag=${url##*/tag/}
    [[ "$tag" =~ ^v[0-9] ]] || { echo "unexpected release URL: $url" >&2; exit 1; }
    echo "$tag"
  args:
    executable: /bin/bash
  register: azurehound_tag
  changed_when: false
  when: vmware_env == "ubuntu"
  tags:
    - azurehound
    - cloud

- name: azurehound - Download release zip (checksum verified)
  get_url:
    url: "https://github.com/SpecterOps/AzureHound/releases/download/{{ azurehound_tag.stdout }}/AzureHound_{{ azurehound_tag.stdout }}_linux_amd64.zip"
    checksum: "sha256:https://github.com/SpecterOps/AzureHound/releases/download/{{ azurehound_tag.stdout }}/AzureHound_{{ azurehound_tag.stdout }}_linux_amd64.zip.sha256"
    dest: /tmp/azurehound.zip
  when: vmware_env == "ubuntu"
  tags:
    - azurehound
    - cloud

- name: azurehound - Extract binary
  unarchive:
    src: /tmp/azurehound.zip
    dest: /usr/local/bin/
    remote_src: yes
    mode: '0755'
  when: vmware_env == "ubuntu"
  tags:
    - azurehound
    - cloud

- name: azurehound - Cleanup
  file:
    path: /tmp/azurehound.zip
    state: absent
  when: vmware_env == "ubuntu"
  tags:
    - azurehound
    - cloud
