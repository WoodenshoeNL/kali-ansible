
- name: Cloud - Copy Cloud_Tools.txt to home directory
  become_user: "{{ login_user }}"
  copy:
    src: Cloud_Tools.txt
    dest: "{{ login_home }}/Cloud_Tools.txt"
    mode: "0644"
  tags:
    - cloud

