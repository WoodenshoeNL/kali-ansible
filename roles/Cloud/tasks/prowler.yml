# Prowler: AWS/Azure/GCP/M365/Kubernetes/GitHub security posture scanner.
# PyPI prowler 5.47.0 declares requires-python <3.14, and Kali rolling and
# Ubuntu 26.04 both default to 3.14: an unpinned `uv tool install` backtracks
# to ancient prowler releases and starts compiling numpy/pandas from source.
# Pin 3.13 (uv downloads it). Drop the pin once prowler allows 3.14.
# The tool venv is ~1.4 GB.
- name: prowler - install/upgrade prowler via uv (Python 3.13)
  # changed only when the tool's package versions changed
  # (--force reinstalls everything, and uv always says "Installed").
  ansible.builtin.shell: |
    set -eo pipefail
    fp() { d="$(uv tool dir)/prowler"; { ls -d "$d"/lib/python*/site-packages/*.dist-info 2>/dev/null | xargs -rn1 basename || true; cat "$d"/lib/python*/site-packages/*.dist-info/direct_url.json 2>/dev/null || true; } | sha256sum; }
    before=$(fp)
    uv tool install --upgrade --force --python 3.13 prowler
    [ "$before" = "$(fp)" ] || echo CHANGED
  args:
    executable: /bin/bash
  register: prowler_uv
  changed_when: "'CHANGED' in prowler_uv.stdout"
  become: true
  become_user: "{{ login_user }}"
  environment:
    PATH: "{{ login_home }}/.local/bin:{{ ansible_facts['env']['PATH'] | default('') }}"
  tags:
    - prowler
    - cloud

- name: prowler - symlink into /usr/local/bin
  ansible.builtin.file:
    src: "{{ login_home }}/.local/bin/prowler"
    dest: /usr/local/bin/prowler
    state: link
    force: true
  tags:
    - prowler
    - cloud
