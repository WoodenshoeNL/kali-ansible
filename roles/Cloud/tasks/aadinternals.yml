# AADInternals (PSGallery): Entra ID / Azure AD offensive PowerShell module -
# tenant recon as outsider, MFA method abuse, token manipulation, B2B invites.
# Installed AllUsers (root-owned) into /usr/local/share/powershell/Modules.
# Idempotent: skipped when already installed; pass -e psgallery_upgrade=true
# to force reinstall/upgrade of the PSGallery modules.
- name: AADInternals - install PowerShell module (AllUsers)
  ansible.builtin.shell: |
    set -eo pipefail
    present=$(pwsh -NoProfile -Command 'if (Get-Module -ListAvailable AADInternals) { "yes" } else { "no" }')
    if [ "$present" = "yes" ] && [ "{{ psgallery_upgrade | default('false') }}" != "true" ]; then
      echo ALREADY_INSTALLED
    else
      pwsh -NoProfile -Command 'Install-PSResource -Name AADInternals -Scope AllUsers -TrustRepository -Reinstall:({{ psgallery_upgrade | default("false") }} -eq "true") -ErrorAction Stop'
      echo INSTALLED
    fi
  args:
    executable: /bin/bash
  register: aadinternals_install
  changed_when: "'ALREADY_INSTALLED' not in aadinternals_install.stdout"
  tags:
    - aadinternals
    - cloud
