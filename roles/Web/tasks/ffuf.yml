
- name: ffuf - create GOPATH for "{{ login_user }}" user
  ansible.builtin.file:
    path: "{{ login_home }}/go"
    state: directory
    owner: "{{ login_user }}"
    group: "{{ login_user }}"
    mode: '0755'
  tags:
    - ffuf
    - web

- name: ffuf - install via go install (runs as "{{ login_user }}")
  become_user: "{{ login_user }}"
  environment:
    GOPATH: "{{ login_home }}/go"
    GOTOOLCHAIN: auto
    PATH: "{{ login_home }}/go/bin:{{ ansible_env.PATH }}"
    TMPDIR: "{{ login_home }}/.cache/go-tmp"
  ansible.builtin.shell: |
    set -euo pipefail
    mkdir -p "$TMPDIR"
    before=$(sha256sum "$GOPATH/bin/ffuf" 2>/dev/null || true)
    go install github.com/ffuf/ffuf/v2@latest
    after=$(sha256sum "$GOPATH/bin/ffuf")
    [ "$before" = "$after" ] || echo CHANGED
  args:
    executable: /bin/bash
  register: ffuf_go
  changed_when: "'CHANGED' in ffuf_go.stdout"
  tags:
    - ffuf
    - web

- name: ffuf - copy binary to /usr/local/bin
  become: true
  ansible.builtin.copy:
    src: "{{ login_home }}/go/bin/ffuf"
    dest: /usr/local/bin/ffuf
    owner: root
    group: root
    mode: '0755'
    remote_src: true
  tags:
    - ffuf
    - web

