
- name: httpx - create GOPATH for "{{ login_user }}" user
  ansible.builtin.file:
    path: "{{ login_home }}/go"
    state: directory
    owner: "{{ login_user }}"
    group: "{{ login_user }}"
    mode: '0755'
  tags:
    - httpx
    - web

- name: httpx - install via go install (runs as "{{ login_user }}")
  become_user: "{{ login_user }}"
  environment:
    GOPATH: "{{ login_home }}/go"
    GOTOOLCHAIN: auto
    PATH: "{{ login_home }}/go/bin:{{ ansible_facts['env']['PATH'] }}"
    TMPDIR: "{{ login_home }}/.cache/go-tmp"
  ansible.builtin.shell: |
    set -euo pipefail
    mkdir -p "$TMPDIR"
    before=$(sha256sum "$GOPATH/bin/httpx" 2>/dev/null || true)
    go install github.com/projectdiscovery/httpx/cmd/httpx@latest
    after=$(sha256sum "$GOPATH/bin/httpx")
    [ "$before" = "$after" ] || echo CHANGED
  args:
    executable: /bin/bash
  register: httpx_go
  changed_when: "'CHANGED' in httpx_go.stdout"
  tags:
    - httpx
    - web

- name: httpx - copy binary to /usr/local/bin
  become: true
  ansible.builtin.copy:
    src: "{{ login_home }}/go/bin/httpx"
    dest: /usr/local/bin/httpx
    owner: root
    group: root
    mode: '0755'
    remote_src: true
  tags:
    - httpx
    - web

