
- name: nuclei - create GOPATH for "{{ login_user }}" user
  ansible.builtin.file:
    path: "{{ login_home }}/go"
    state: directory
    owner: "{{ login_user }}"
    group: "{{ login_user }}"
    mode: '0755'
  tags:
    - nuclei
    - web

- name: nuclei - install via go install (runs as "{{ login_user }}")
  become_user: "{{ login_user }}"
  environment:
    GOPATH: "{{ login_home }}/go"
    GOTOOLCHAIN: auto
    PATH: "{{ login_home }}/go/bin:{{ ansible_env.PATH }}"
    TMPDIR: "{{ login_home }}/.cache/go-tmp"
  ansible.builtin.shell: |
    set -euo pipefail
    mkdir -p "$TMPDIR"
    before=$(sha256sum "$GOPATH/bin/nuclei" 2>/dev/null || true)
    go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
    after=$(sha256sum "$GOPATH/bin/nuclei")
    [ "$before" = "$after" ] || echo CHANGED
  args:
    executable: /bin/bash
  register: nuclei_go
  changed_when: "'CHANGED' in nuclei_go.stdout"
  tags:
    - nuclei
    - web

- name: nuclei - copy binary to /usr/local/bin
  become: true
  ansible.builtin.copy:
    src: "{{ login_home }}/go/bin/nuclei"
    dest: /usr/local/bin/nuclei
    owner: root
    group: root
    mode: '0755'
    remote_src: true
  tags:
    - nuclei
    - web

