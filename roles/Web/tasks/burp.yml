# Pinned to 2026.1: since ~2026.3 PortSwigger gates Community downloads
# behind a reCAPTCHA on /burp/communitydownload, so newer versions cannot be
# fetched by URL. To go newer, download manually and bump this pin.
- name: burpsuite - Download installer
  get_url:
    url: https://portswigger-cdn.net/burp/releases/download?product=community&version=2026.1&type=Linux
    dest: /tmp/burpsuite_installer.sh
    mode: '0755'
  when: vmware_env == "ubuntu"
  tags:
    - burpsuite
    - web

- name: burpsuite - Run installer (silent)
  command: /tmp/burpsuite_installer.sh -q
  args:
    creates: /opt/BurpSuiteCommunity/BurpSuiteCommunity
  when: vmware_env == "ubuntu"
  tags:
    - burpsuite
    - web

- name: burpsuite - Create symlink
  file:
    src: /opt/BurpSuiteCommunity/BurpSuiteCommunity
    dest: /usr/local/bin/burpsuite
    state: link
  when: vmware_env == "ubuntu"
  tags:
    - burpsuite
    - web

- name: burpsuite - Cleanup installer
  file:
    path: /tmp/burpsuite_installer.sh
    state: absent
  when: vmware_env == "ubuntu"
  tags:
    - burpsuite
    - web