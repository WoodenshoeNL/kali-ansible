# torbrowser-launcher comes from the distro on both Kali and Ubuntu (universe).
# The old vmware_env=torbrowser path added deb.torproject.org, which does not
# carry torbrowser-launcher at all, used apt_key (the apt-key binary is gone
# from current Debian/Kali, so the task failed) and wrote a kali-rolling suite
# that repo does not have, breaking every later apt update. Remove its leftovers.
- name: torbrowser - Remove Tor Project repo and key left by older runs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/tor.list
    - /usr/share/keyrings/torproject.gpg
  tags:
    - torbrowser
    - privacy

- name: torbrowser - Install torbrowser-launcher
  ansible.builtin.apt:
    name: torbrowser-launcher
    state: present
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - torbrowser
    - privacy
