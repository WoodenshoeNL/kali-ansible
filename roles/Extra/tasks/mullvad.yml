
- name: Mullvad - Install required dependencies
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
    state: present
    update_cache: yes
  tags:
    - mullvad
    - vpn

- name: Mullvad - Download Mullvad GPG key
  ansible.builtin.get_url:
    url: https://repository.mullvad.net/deb/mullvad-keyring.asc
    dest: /tmp/mullvad-keyring.asc
    mode: '0644'
  tags:
    - mullvad
    - vpn

- name: Mullvad - Dearmor and install Mullvad GPG key
  ansible.builtin.shell: |
    gpg --dearmor < /tmp/mullvad-keyring.asc > /usr/share/keyrings/mullvad-keyring.gpg
  args:
    executable: /bin/bash
    creates: /usr/share/keyrings/mullvad-keyring.gpg
  tags:
    - mullvad
    - vpn

# Mullvad publishes a distro-independent `stable` suite; per-release suites
# are missing for kali-rolling and resolute (26.04), both 404.
- name: Mullvad - Add Mullvad repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/mullvad-keyring.gpg] https://repository.mullvad.net/deb/stable stable main"
    filename: mullvad
    state: present
  tags:
    - mullvad
    - vpn

- name: Mullvad - Install Mullvad VPN package
  ansible.builtin.apt:
    name: mullvad-vpn
    state: present
    update_cache: yes
  tags:
    - mullvad
    - vpn

- name: Mullvad - Clean up temporary files
  ansible.builtin.file:
    path: /tmp/mullvad-keyring.asc
    state: absent
  tags:
    - mullvad
    - vpn
