---
# roles/Extra/tasks/codex.yml
# OpenAI Codex CLI - AI coding assistant in the terminal
# Opt-in: set install_codex=true. Requires login_user and login_home.
# Requires: Node.js v18+ (installed via NodeSource)

# ------------------------------------------------------------------------------
# Dependencies
# ------------------------------------------------------------------------------
- name: Codex - Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: yes
  tags:
    - codex
    - AI

# ------------------------------------------------------------------------------
# Node.js via NodeSource (24.x)
# ------------------------------------------------------------------------------
- name: Codex - Add NodeSource GPG key
  ansible.builtin.shell: |
    set -eo pipefail
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
  args:
    executable: /bin/bash
    creates: /usr/share/keyrings/nodesource.gpg
  tags:
    - codex
    - AI

# Node 24: n8n 2.x declares engines.node >=24 (2.45.7, checked 2026-11-02).
# n8n and codex share this file; it is always rewritten so an older node_20
# line from a previous run is replaced, not kept.
- name: Codex - Add NodeSource repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nodesource.list
    content: "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main\n"
    mode: "0644"
  tags:
    - codex
    - AI

- name: Codex - Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: latest
    update_cache: yes
  tags:
    - codex
    - AI

# ------------------------------------------------------------------------------
# Codex CLI via npm
# ------------------------------------------------------------------------------
- name: Codex - Install Codex CLI globally via npm
  community.general.npm:
    name: "@openai/codex"
    global: yes
    state: latest
  tags:
    - codex
    - AI

# ------------------------------------------------------------------------------
# Verify
# ------------------------------------------------------------------------------
- name: Codex - Verify installation
  ansible.builtin.command: codex --version
  register: codex_version
  changed_when: false
  tags:
    - codex
    - AI

- name: Codex - Display installed version
  ansible.builtin.debug:
    msg: "Codex CLI installed successfully: {{ codex_version.stdout }}"
  tags:
    - codex
    - AI
