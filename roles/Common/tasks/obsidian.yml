- name: obsidian - install package
  ansible.builtin.apt:
    name: obsidian
    state: latest
    update_cache: yes
    cache_valid_time: 3600
  when: vmware_env in ["workstation", "laptop"]
  tags:
    - obsidian
    - common

- name: obsidian - Get latest release version that ships the amd64 deb
  # The newest release is sometimes incomplete (e.g. v1.13.8 shipped only the
  # Android apk). Walk the releases feed newest-first and take the first one
  # whose obsidian_*_amd64.deb actually downloads. The Atom feed and the
  # download URLs are not subject to api.github.com's 60 requests/hour limit.
  ansible.builtin.shell: |
    set -euo pipefail
    feed=https://github.com/obsidianmd/obsidian-releases/releases.atom
    for v in $(curl -fsSL "$feed" | grep -o 'releases/tag/v[0-9.]*' | sed 's#.*/tag/v##' | uniq); do
      if curl -fsSIL -o /dev/null "https://github.com/obsidianmd/obsidian-releases/releases/download/v${v}/obsidian_${v}_amd64.deb"; then
        echo "$v"; exit 0
      fi
    done
    echo "no Obsidian release with an amd64 deb in the feed" >&2; exit 1
  args:
    executable: /bin/bash
  register: obsidian_version_raw
  changed_when: false
  when: vmware_env == "ubuntu"
  tags:
    - obsidian
    - common

- name: obsidian - Set version fact
  ansible.builtin.set_fact:
    obsidian_version: "{{ obsidian_version_raw.stdout | regex_replace('^v', '') }}"
  when: vmware_env == "ubuntu"
  tags:
    - obsidian
    - common

- name: obsidian - Download deb package
  ansible.builtin.get_url:
    url: "https://github.com/obsidianmd/obsidian-releases/releases/download/v{{ obsidian_version }}/obsidian_{{ obsidian_version }}_amd64.deb"
    dest: "/tmp/obsidian_{{ obsidian_version }}_amd64.deb"
    mode: '0644'
  when: vmware_env == "ubuntu"
  tags:
    - obsidian
    - common

- name: obsidian - Install deb package
  ansible.builtin.apt:
    deb: "/tmp/obsidian_{{ obsidian_version }}_amd64.deb"
    state: present
  when: vmware_env == "ubuntu"
  tags:
    - obsidian
    - common