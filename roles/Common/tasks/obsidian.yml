- name: obsidian - install package
  ansible.builtin.apt:
    name: obsidian
    state: latest
    update_cache: yes
    cache_valid_time: 3600
  when: vmware_env in ["workstation", "laptop"]
  tags:
    - obsidian
    - common

- name: obsidian - Get latest release version that ships the amd64 deb
  # The 'latest' release is sometimes incomplete (e.g. v1.13.8 shipped only the
  # Android apk). Walk recent releases and use the newest one that actually has
  # an obsidian_*_amd64.deb asset.
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL -H "Accept: application/vnd.github.v3+json" \
      "https://api.github.com/repos/obsidianmd/obsidian-releases/releases?per_page=10" \
      | jq -r '[.[] | select([.assets[].name] | any(endswith("_amd64.deb"))) | .tag_name][0]'
  register: obsidian_version_raw
  changed_when: false
  when: vmware_env == "ubuntu"
  tags:
    - obsidian
    - common

- name: obsidian - Set version fact
  ansible.builtin.set_fact:
    obsidian_version: "{{ obsidian_version_raw.stdout | regex_replace('^v', '') }}"
  when: vmware_env == "ubuntu"
  tags:
    - obsidian
    - common

- name: obsidian - Download deb package
  ansible.builtin.get_url:
    url: "https://github.com/obsidianmd/obsidian-releases/releases/download/v{{ obsidian_version }}/obsidian_{{ obsidian_version }}_amd64.deb"
    dest: "/tmp/obsidian_{{ obsidian_version }}_amd64.deb"
    mode: '0644'
  when: vmware_env == "ubuntu"
  tags:
    - obsidian
    - common

- name: obsidian - Install deb package
  ansible.builtin.apt:
    deb: "/tmp/obsidian_{{ obsidian_version }}_amd64.deb"
    state: present
  when: vmware_env == "ubuntu"
  tags:
    - obsidian
    - common