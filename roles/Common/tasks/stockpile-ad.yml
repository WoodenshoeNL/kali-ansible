# SharpHound from SpecterOps/SharpHound is the BloodHound CE collector (the
# BloodHoundAD/SharpHound v1 line only feeds legacy BloodHound). AzureHound is
# installed for Linux elsewhere; its Windows build is not stockpiled.
- name: SharpHound - create destination directory
  ansible.builtin.file:
    path: /stockpile/SharpHound
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - sharphound
    - stockpile
    - common

# Asset names carry the version, so take the tag from the releases/latest
# redirect instead of api.github.com (agent.md 4.7).
- name: SharpHound - resolve latest release tag
  ansible.builtin.shell: |
    set -eo pipefail
    url=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/SpecterOps/SharpHound/releases/latest)
    tag=${url##*/tag/}
    [[ "$tag" =~ ^v[0-9] ]] || { echo "unexpected release URL: $url" >&2; exit 1; }
    echo "$tag"
  args:
    executable: /bin/bash
  register: sharphound_tag
  changed_when: false
  tags:
    - sharphound
    - stockpile
    - common

- name: SharpHound - check whether this release is already in the stockpile
  ansible.builtin.stat:
    path: "/stockpile/SharpHound/.release-{{ sharphound_tag.stdout }}"
  register: sharphound_marker
  tags:
    - sharphound
    - stockpile
    - common

# Upstream publishes a .sha256 next to each zip ("<hash> *<name>").
- name: SharpHound - download release zip
  ansible.builtin.get_url:
    url: "https://github.com/SpecterOps/SharpHound/releases/download/{{ sharphound_tag.stdout }}/SharpHound_{{ sharphound_tag.stdout }}_windows_x86.zip"
    checksum: "sha256:https://github.com/SpecterOps/SharpHound/releases/download/{{ sharphound_tag.stdout }}/SharpHound_{{ sharphound_tag.stdout }}_windows_x86.zip.sha256"
    dest: /tmp/SharpHound.zip
    mode: '0644'
    timeout: 60
  register: sharphound_dl
  retries: 3
  delay: 5
  until: sharphound_dl is not failed
  when: not sharphound_marker.stat.exists
  tags:
    - sharphound
    - stockpile
    - common

# Flat zip: SharpHound.exe, SharpHound.exe.config, SharpHound.pdb, SharpHound.ps1.
- name: SharpHound - unpack into stockpile
  ansible.builtin.unarchive:
    src: /tmp/SharpHound.zip
    dest: /stockpile/SharpHound
    remote_src: yes
    owner: root
    group: root
    mode: '0644'
  when: not sharphound_marker.stat.exists
  tags:
    - sharphound
    - stockpile
    - common

- name: SharpHound - record the stockpiled release
  ansible.builtin.shell: |
    rm -f /stockpile/SharpHound/.release-*
    touch "/stockpile/SharpHound/.release-{{ sharphound_tag.stdout }}"
  when: not sharphound_marker.stat.exists
  tags:
    - sharphound
    - stockpile
    - common

- name: SharpHound - remove temporary zip
  ansible.builtin.file:
    path: /tmp/SharpHound.zip
    state: absent
  when: not sharphound_marker.stat.exists
  tags:
    - sharphound
    - stockpile
    - common

