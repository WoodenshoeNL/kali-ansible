# Windows-side AD / Entra tools for the stockpile: kept on the host for
# transfer to targets, never executed here, so files are 0644.
#
# Certify is not here: /stockpile/Ghostpack-CompiledBinaries already has
# Certify.exe (1.x), and /stockpile/SharpCollection has another build.
# GhostPack/Certify publishes no release binaries, Certify 2.0 included.

- name: DomainPasswordSpray - create destination directory
  ansible.builtin.file:
    path: /stockpile/DomainPasswordSpray
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - domainpasswordspray
    - stockpile
    - common

# No releases; the script lives on the default branch.
- name: DomainPasswordSpray - download DomainPasswordSpray.ps1
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/dafthack/DomainPasswordSpray/master/DomainPasswordSpray.ps1
    dest: /stockpile/DomainPasswordSpray/DomainPasswordSpray.ps1
    owner: root
    group: root
    mode: '0644'
    force: yes
    timeout: 60
  register: dps_dl
  retries: 3
  delay: 5
  until: dps_dl is not failed
  tags:
    - domainpasswordspray
    - stockpile
    - common

