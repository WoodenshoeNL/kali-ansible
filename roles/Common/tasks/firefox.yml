
- name: Ensure Firefox is installed
  package:
    name: firefox-esr
    state: present
  when: vmware_env in ["workstation", "laptop"]
  tags:
    - Firefox
    - common

- name: Firefox - Make sure {{ login_home }}/scripts exists
  file:
    path: "{{ login_home }}/scripts"
    state: directory
    owner: "{{ login_user }}"
    group: "{{ login_user }}"
    mode: "0755"
  when: vmware_env in ["workstation", "laptop", "ubuntu"]
  tags:
    - Firefox
    - quiet_firefox
    - common

- name: Firefox - Copy quiet_firefox.py into {{ login_home }}/scripts
  copy:
    src: quiet_firefox.py
    dest: "{{ login_home }}/scripts/quiet_firefox.py"
    owner: "{{ login_user }}"
    group: "{{ login_user }}"
    mode: "0755"
  when: vmware_env in ["workstation", "laptop", "ubuntu"]
  tags:
    - Firefox
    - quiet_firefox
    - common

# Firefox 147+ puts a NEW profile under ~/.config/mozilla/firefox (XDG), older
# releases and existing installs under ~/.mozilla/firefox, the Ubuntu snap under
# ~/snap/firefox/common/. quiet_firefox.py searches all of them; this only has
# to make sure at least one profiles.ini exists before it runs.
- name: Firefox - Create a default Firefox profile (headless) when none exists
  ansible.builtin.shell: |
    for d in "$HOME/.config/mozilla/firefox" "$HOME/.mozilla/firefox" \
             "$HOME/snap/firefox/common/.config/mozilla/firefox" \
             "$HOME/snap/firefox/common/.mozilla/firefox"; do
      if [ -f "$d/profiles.ini" ]; then echo "exists: $d"; exit 0; fi
    done
    firefox --headless --createprofile default && echo created
  register: fx_profile
  changed_when: "'created' in fx_profile.stdout"
  become: true
  become_user: "{{ login_user }}"
  environment:
    HOME: "{{ login_home }}"
  when: vmware_env in ["workstation", "laptop", "ubuntu"]
  tags:
    - Firefox
    - quiet_firefox
    - common

- name: Firefox - Run quiet_firefox.py inside the {{ login_user }} profile
  command: python3 quiet_firefox.py
  args:
    chdir: "{{ login_home }}/scripts"
  register: quiet_firefox_run
  changed_when: >-
    'Created/updated user.js' in quiet_firefox_run.stdout
    or 'Cleared cached telemetry' in quiet_firefox_run.stdout
  become: true
  become_user: "{{ login_user }}"
  environment:
    HOME: "{{ login_home }}"
  when: vmware_env in ["workstation", "laptop", "ubuntu"]
  tags:
    - Firefox
    - quiet_firefox
    - common
