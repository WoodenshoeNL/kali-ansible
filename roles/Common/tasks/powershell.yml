# PowerShell 7.
# - Kali: Kali's own `powershell` package. Microsoft has no Kali config package
#   (config/kali/<version>/packages-microsoft-prod.deb is a 404), which aborted
#   the run here, and Kali already carries PowerShell itself.
# - Ubuntu/Debian: Microsoft's repo. Microsoft does not publish PowerShell for
#   every Ubuntu release (none for questing 25.10 or resolute 26.04, checked
#   2026-11-02), so the newest repo that carries it is probed for below.
- name: powershell - install PowerShell 7 from the Kali repo
  ansible.builtin.apt:
    name: powershell
    state: present
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_facts['distribution'] == 'Kali'
  tags:
    - powershell
    - common
    - core

- name: powershell - Choose repo and suite for Microsoft packages
  # Microsoft does not publish PowerShell for every Ubuntu release (e.g. no
  # plucky/questing repos ship it). Probe the -prod repos newest-first and use
  # the newest one that actually carries the powershell package; fall back to
  # noble (24.04 LTS), the last release with guaranteed coverage.
  block:
    - name: powershell - Probe Microsoft repos for powershell package (newest first)
      ansible.builtin.shell: |
        for rel in {{ ansible_facts['distribution_release'] }} noble; do
          if curl -fsSL "https://packages.microsoft.com/repos/microsoft-ubuntu-${rel}-prod/dists/${rel}/main/binary-amd64/Packages" \
               | grep -q '^Package: powershell$'; then
            echo "$rel"; exit 0
          fi
        done
        echo "none"
      register: pwsh_probe
      changed_when: false
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: powershell - Set repo suite fact
      ansible.builtin.set_fact:
        pwsh_distro_prefix: "{{ 'microsoft-ubuntu' if ansible_facts['distribution'] == 'Ubuntu' else 'microsoft-debian' }}"
        pwsh_suite: "{{ (pwsh_probe.stdout_lines | default([]) | last | default('noble')) if (ansible_facts['distribution'] == 'Ubuntu') else ansible_facts['distribution_release'] }}"
      when: (ansible_facts['os_family'] == 'Debian' and ansible_facts['distribution'] != 'Kali')
  when: (ansible_facts['os_family'] == 'Debian' and ansible_facts['distribution'] != 'Kali')
  tags:
    - powershell
    - common
    - core

- name: powershell - Ensure prerequisite packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes
    cache_valid_time: 3600
  when: (ansible_facts['os_family'] == 'Debian' and ansible_facts['distribution'] != 'Kali')
  tags:
    - powershell
    - common
    - core

# Key: the legacy keys/microsoft.asc (2015 key BC52...29CF) does NOT contain the
# current signer for the ubuntu-*-prod repos (rsa4096 2023 key AA86F75E...182B).
# Canonical source for the current key: the packages-microsoft-prod config deb,
# e.g. https://packages.microsoft.com/config/<distro>/<release>/packages-microsoft-prod.deb
# (contains usr/share/keyrings/microsoft-prod.gpg). Key pinned by fingerprint.
- name: powershell - Download Microsoft config package (carries current signing key)
  ansible.builtin.get_url:
    url: "https://packages.microsoft.com/config/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_version'] }}/packages-microsoft-prod.deb"
    dest: /tmp/packages-microsoft-prod.deb
    mode: '0644'
  when: (ansible_facts['os_family'] == 'Debian' and ansible_facts['distribution'] != 'Kali')
  tags:
    - powershell
    - common
    - core

- name: powershell - Download legacy Microsoft signing key (2015, still signs older repos e.g. noble)
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /tmp/microsoft-powershell.asc
    mode: '0644'
    force: yes
  when: (ansible_facts['os_family'] == 'Debian' and ansible_facts['distribution'] != 'Kali')
  tags:
    - powershell
    - common
    - core

- name: powershell - Build combined signing keyring (legacy 2015 + current 2023 keys)
  # Replace the keyring only when its content changed, so a re-run reports ok.
  ansible.builtin.shell: |
    set -eo pipefail
    rm -rf /tmp/ms-prod-ext && mkdir -p /tmp/ms-prod-ext
    dpkg-deb -x /tmp/packages-microsoft-prod.deb /tmp/ms-prod-ext
    gpg --batch --yes --dearmor -o /tmp/microsoft-legacy.gpg /tmp/microsoft-powershell.asc
    tmp=$(mktemp); trap 'rm -f "$tmp"' EXIT
    cat /tmp/microsoft-legacy.gpg /tmp/ms-prod-ext/usr/share/keyrings/microsoft-prod.gpg > "$tmp"
    if ! cmp -s "$tmp" "/usr/share/keyrings/microsoft-powershell.gpg"; then install -m 0644 "$tmp" "/usr/share/keyrings/microsoft-powershell.gpg"; echo CHANGED; fi
  args:
    executable: /bin/bash
  register: pwsh_keyring
  changed_when: "'CHANGED' in pwsh_keyring.stdout"
  when: (ansible_facts['os_family'] == 'Debian' and ansible_facts['distribution'] != 'Kali')
  tags:
    - powershell
    - common
    - core

# Which key a config package carries depends on the release: 24.04's has only
# the 2015 key (BC52...29CF), 25.10's only the 2023 key (AA86...182B). Requiring
# both made 24.04 fail here. Require the legacy key (it signs the noble repo that
# newer Ubuntu releases fall back to) and refuse any key that is not one of the two.
- name: powershell - Verify signing key fingerprints (legacy present, nothing unexpected)
  ansible.builtin.shell: |
    set -e
    fprs=$(gpg --no-default-keyring --keyring /usr/share/keyrings/microsoft-powershell.gpg --list-keys --with-colons | grep '^fpr' | cut -d: -f10)
    echo "$fprs" | grep -qx 'BC528686B50D79E339D3721CEB3E94ADBE1229CF'
    ! echo "$fprs" | grep -vxE 'BC528686B50D79E339D3721CEB3E94ADBE1229CF|AA86F75E427A19DD33346403EE4D7792F748182B'
  args:
    executable: /bin/bash
  changed_when: false
  when: (ansible_facts['os_family'] == 'Debian' and ansible_facts['distribution'] != 'Kali')
  tags:
    - powershell
    - common
    - core

- name: powershell - Add Microsoft PowerShell repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-powershell.gpg]
      https://packages.microsoft.com/repos/{{ pwsh_distro_prefix }}-{{ pwsh_suite }}-prod {{ pwsh_suite }} main
    filename: powershell
    state: present
  when: (ansible_facts['os_family'] == 'Debian' and ansible_facts['distribution'] != 'Kali')
  tags:
    - powershell
    - common
    - core

- name: powershell - install PowerShell 7
  ansible.builtin.apt:
    name: powershell
    state: present
    install_recommends: false
    update_cache: yes
    cache_valid_time: 3600
  when: (ansible_facts['os_family'] == 'Debian' and ansible_facts['distribution'] != 'Kali')
  tags:
    - powershell
    - common
    - core
