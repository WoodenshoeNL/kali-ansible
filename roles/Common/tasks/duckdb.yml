# DuckDB CLI, latest release.
# DuckDB 2.0.0 renamed the asset from duckdb_cli-linux-amd64.zip to
# duckdb-cli-linux-amd64.tar.gz (a bare `duckdb` binary). The releases/latest/
# download redirect is used instead of api.github.com, whose unauthenticated
# 60 requests/hour limit is shared by everyone behind the same NAT.

- name: DuckDB - Download and extract CLI (latest release)
  ansible.builtin.unarchive:
    src: "https://github.com/duckdb/duckdb/releases/latest/download/duckdb-cli-linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: yes
    mode: '0755'
  tags:
    - duckdb
    - common
