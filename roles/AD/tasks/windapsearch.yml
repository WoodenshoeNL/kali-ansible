- name: windapsearch - Ensure installation directory exists
  file:
    path: "/opt/windapsearch"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - windapsearch
    - AD

- name: windapsearch - Download latest Windapsearch binary
  get_url:
    url: "https://github.com/ropnop/go-windapsearch/releases/latest/download/windapsearch-linux-amd64"
    dest: "/opt/windapsearch/windapsearch"
    mode: "0755"
    force: true       # always refresh to latest
  register: windap_dl
  tags:
    - windapsearch
    - AD
