# The asset name carries no version, so releases/latest/download avoids the
# rate-limited api.github.com lookup (60 requests/hour per NAT).
- name: kerbrute - download & install latest
  ansible.builtin.get_url:
    url: "https://github.com/ropnop/kerbrute/releases/latest/download/kerbrute_linux_amd64"
    dest: "/usr/local/bin/kerbrute"
    mode: "0755"
    owner: root
    group: root
    force: true       # always refresh to latest
  tags:
    - kerbrute
    - AD
