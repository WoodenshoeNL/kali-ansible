# RustHound-CE: prebuilt Linux release binary, every environment.
# - Kali has no rusthound-ce package (the apt task aborted the run on Kali).
# - The old Ubuntu asset regex `linux.*x86_64` was case-sensitive against
#   `rusthound-ce-Linux-gnu-x86_64.tar.gz`, so it never matched and every run
#   fell back to a full cargo build.
# The asset name carries no version, so releases/latest/download needs no
# api.github.com call; the published .sha256 is checked by get_url.

- name: rusthound-ce - Download latest Linux x86_64 release (checksum verified)
  ansible.builtin.get_url:
    url: https://github.com/g0h4n/RustHound-CE/releases/latest/download/rusthound-ce-Linux-gnu-x86_64.tar.gz
    checksum: "sha256:https://github.com/g0h4n/RustHound-CE/releases/latest/download/rusthound-ce-Linux-gnu-x86_64.tar.gz.sha256"
    dest: /tmp/rusthound-ce-Linux-gnu-x86_64.tar.gz
    mode: "0644"
    force: yes
  tags:
    - rusthound-ce
    - AD

- name: rusthound-ce - Create extract directory
  ansible.builtin.tempfile:
    state: directory
    suffix: rusthound-ce
  register: rusthound_ce_tmp
  tags:
    - rusthound-ce
    - AD

- name: rusthound-ce - Extract release archive
  ansible.builtin.unarchive:
    src: /tmp/rusthound-ce-Linux-gnu-x86_64.tar.gz
    dest: "{{ rusthound_ce_tmp.path }}"
    remote_src: yes
  tags:
    - rusthound-ce
    - AD

- name: rusthound-ce - Install binary to /usr/local/bin
  ansible.builtin.copy:
    src: "{{ rusthound_ce_tmp.path }}/rusthound-ce"
    dest: /usr/local/bin/rusthound-ce
    mode: "0755"
    owner: root
    group: root
    remote_src: yes
  tags:
    - rusthound-ce
    - AD

- name: rusthound-ce - Cleanup
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/rusthound-ce-Linux-gnu-x86_64.tar.gz
    - "{{ rusthound_ce_tmp.path }}"
  tags:
    - rusthound-ce
    - AD

- name: rusthound-ce - Verify installation
  ansible.builtin.command: /usr/local/bin/rusthound-ce --help
  changed_when: false
  tags:
    - rusthound-ce
    - AD
