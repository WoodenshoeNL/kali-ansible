- name: DonPAPI - install python3-lxml system package
  become: yes
  ansible.builtin.apt:
    name:
      - python3-lxml
      # headers needed when uv must build lxml from source (no wheel for the
      # running Python); harmless when wheels are available
      - libxml2-dev
      - libxslt1-dev
    state: present
  tags:
    - DonPAPI
    - AD

- name: DonPAPI - remove broken uv tool installation if exists
  ansible.builtin.command:
    argv:
      - uv
      - tool
      - uninstall
      - donpapi
  become: yes
  become_user: "{{ login_user }}"
  environment:
    PATH: "{{ login_home }}/.local/bin:{{ ansible_env.PATH | default('') }}"
  register: uv_uninstall
  changed_when: uv_uninstall.rc == 0
  failed_when: false
  tags:
    - DonPAPI
    - AD

- name: DonPAPI - install DonPAPI via uv (with setuptools)
  # --python 3.12: donpapi -> dploot pins lxml 4.9.3, whose Cython-generated C
  # does not compile against Python 3.13+/3.14 (removed private C-APIs). 3.12
  # still has prebuilt lxml wheels.
  ansible.builtin.command:
    argv:
      - uv
      - tool
      - install
      - --force
      - --python
      - "3.12"
      - --with
      - setuptools
      - donpapi
  become: yes
  become_user: "{{ login_user }}"
  environment:
    PATH: "{{ login_home }}/.local/bin:{{ ansible_env.PATH | default('') }}"
  tags:
    - DonPAPI
    - AD
