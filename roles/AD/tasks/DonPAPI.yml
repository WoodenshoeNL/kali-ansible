- name: DonPAPI - install python3-lxml system package
  become: yes
  ansible.builtin.apt:
    name:
      - python3-lxml
      # headers needed when uv must build lxml from source (no wheel for the
      # running Python); harmless when wheels are available
      - libxml2-dev
      - libxslt1-dev
    state: present
  tags:
    - DonPAPI
    - AD

- name: DonPAPI - remove broken uv tool installation if exists
  ansible.builtin.command:
    argv:
      - uv
      - tool
      - uninstall
      - donpapi
  become: yes
  become_user: "{{ login_user }}"
  environment:
    PATH: "{{ login_home }}/.local/bin:{{ ansible_facts['env']['PATH'] | default('') }}"
  register: uv_uninstall
  changed_when: uv_uninstall.rc == 0
  failed_when: false
  tags:
    - DonPAPI
    - AD

- name: DonPAPI - install DonPAPI via uv (with setuptools)
  # --python 3.12: donpapi -> dploot pins lxml 4.9.3, whose Cython-generated C
  # does not compile against Python 3.13+/3.14 (removed private C-APIs). 3.12
  # still has prebuilt lxml wheels.
  # changed only when the tool's package versions or git commit changed
  # (--force reinstalls everything, and uv always says "Installed").
  ansible.builtin.shell: |
    set -eo pipefail
    fp() { d="$(uv tool dir)/donpapi"; { ls -d "$d"/lib/python*/site-packages/*.dist-info 2>/dev/null | xargs -rn1 basename || true; cat "$d"/lib/python*/site-packages/*.dist-info/direct_url.json 2>/dev/null || true; } | sha256sum; }
    before=$(fp)
    uv tool install --force --python 3.12 --with setuptools donpapi
    [ "$before" = "$(fp)" ] || echo CHANGED
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ login_user }}"
  environment:
    PATH: "{{ login_home }}/.local/bin:{{ ansible_facts['env']['PATH'] | default('') }}"
  register: donpapi_uv
  changed_when: "'CHANGED' in donpapi_uv.stdout"
  tags:
    - DonPAPI
    - AD
