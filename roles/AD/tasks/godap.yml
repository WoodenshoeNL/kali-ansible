- name: godap - install latest release with go install (tracks @latest, as login_user)
  become: yes
  become_user: "{{ login_user }}"
  ansible.builtin.shell: |
    set -euo pipefail
    mkdir -p "$TMPDIR"
    before=$(sha256sum "$GOPATH/bin/godap" 2>/dev/null || true)
    go install github.com/Macmod/godap/v2@latest
    after=$(sha256sum "$GOPATH/bin/godap")
    [ "$before" = "$after" ] || echo CHANGED
  args:
    executable: /bin/bash
  environment:
    GOPATH: "{{ login_home }}/go"
    GOTOOLCHAIN: auto
    PATH: "{{ login_home }}/go/bin:{{ ansible_facts['env']['PATH'] }}"
    TMPDIR: "{{ login_home }}/.cache/go-tmp"
  register: godap_go
  changed_when: "'CHANGED' in godap_go.stdout"
  tags:
    - godap
    - AD

- name: godap - copy binary to /usr/local/bin
  become: true
  ansible.builtin.copy:
    src: "{{ login_home }}/go/bin/godap"
    dest: /usr/local/bin/godap
    owner: root
    group: root
    mode: '0755'
    remote_src: true
  tags:
    - godap
    - AD
