- name: ldapx - install latest release with go install (tracks @latest, as login_user)
  become: yes
  become_user: "{{ login_user }}"
  ansible.builtin.shell: |
    set -euo pipefail
    mkdir -p "$TMPDIR"
    before=$(sha256sum "$GOPATH/bin/ldapx" 2>/dev/null || true)
    go install github.com/Macmod/ldapx@latest
    after=$(sha256sum "$GOPATH/bin/ldapx")
    [ "$before" = "$after" ] || echo CHANGED
  args:
    executable: /bin/bash
  environment:
    GOPATH: "{{ login_home }}/go"
    GOTOOLCHAIN: auto
    PATH: "{{ login_home }}/go/bin:{{ ansible_env.PATH }}"
    TMPDIR: "{{ login_home }}/.cache/go-tmp"
  register: ldapx_go
  changed_when: "'CHANGED' in ldapx_go.stdout"
  tags:
    - ldapx
    - AD

- name: ldapx - copy binary to /usr/local/bin
  become: true
  ansible.builtin.copy:
    src: "{{ login_home }}/go/bin/ldapx"
    dest: /usr/local/bin/ldapx
    owner: root
    group: root
    mode: '0755'
    remote_src: true
  tags:
    - ldapx
    - AD
