- name: ligolo-ng - create tools directory
  ansible.builtin.file:
    path: "{{ login_home }}/tools/ligolo-ng"
    state: directory
    owner: "{{ login_user }}"
    group: "{{ login_user }}"
    mode: "0755"
  tags:
    - ligolo
    - pivot
    - network

# Asset names carry the version, so take the tag from the releases/latest
# redirect instead of api.github.com (60 requests/hour per NAT). An empty or
# odd tag now fails here instead of producing three 404 retries later.
- name: ligolo-ng - resolve latest release tag
  ansible.builtin.shell: |
    set -euo pipefail
    url=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/nicocha30/ligolo-ng/releases/latest)
    tag=${url##*/tag/}
    [[ "$tag" =~ ^v[0-9] ]] || { echo "unexpected release URL: $url" >&2; exit 1; }
    echo "$tag"
  args:
    executable: /bin/bash
  register: ligolo_tag
  changed_when: false
  tags:
    - ligolo
    - pivot
    - network

- name: ligolo-ng - download and install proxy + agent binaries
  ansible.builtin.get_url:
    url: "https://github.com/nicocha30/ligolo-ng/releases/download/{{ ligolo_tag.stdout }}/ligolo-ng_{{ item }}_{{ ligolo_tag.stdout | replace('v', '') }}_linux_amd64.tar.gz"
    dest: "/tmp/ligolo-{{ item }}.tar.gz"
    mode: "0644"
    timeout: 60
  loop:
    - proxy
    - agent
  register: ligolo_dl
  retries: 3
  delay: 5
  until: ligolo_dl is not failed
  tags:
    - ligolo
    - pivot
    - network

- name: ligolo-ng - create extract directories
  ansible.builtin.file:
    path: "/tmp/ligolo-extract-{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - proxy
    - agent
  tags:
    - ligolo
    - pivot
    - network

- name: ligolo-ng - extract binaries
  ansible.builtin.unarchive:
    src: "/tmp/ligolo-{{ item }}.tar.gz"
    dest: "/tmp/ligolo-extract-{{ item }}"
    remote_src: yes
  loop:
    - proxy
    - agent
  tags:
    - ligolo
    - pivot
    - network

# copy compares checksums, so a new release replaces the binaries (the old
# `install ... creates:` never upgraded them).
- name: ligolo-ng - install binaries as ligolo-proxy / ligolo-agent
  ansible.builtin.copy:
    src: "/tmp/ligolo-extract-{{ item }}/{{ item }}"
    dest: "/usr/local/bin/ligolo-{{ item }}"
    remote_src: yes
    owner: root
    group: root
    mode: "0755"
  loop:
    - proxy
    - agent
  tags:
    - ligolo
    - pivot
    - network

- name: ligolo-ng - remove generic-named binaries from earlier layout
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/proxy
    - /usr/local/bin/agent
  tags:
    - ligolo
    - pivot
    - network

- name: ligolo-ng - remove downloads
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/ligolo-proxy.tar.gz
    - /tmp/ligolo-agent.tar.gz
    - /tmp/ligolo-extract-proxy
    - /tmp/ligolo-extract-agent
  tags:
    - ligolo
    - pivot
    - network
