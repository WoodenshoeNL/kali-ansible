# hashcat {{ hashcat_version }} from the official release (Kali and Ubuntu both
# package 7.1.2). Version and SHA-256 are pinned in roles/Network/defaults.
#
# The release build is "portable": it keeps hashcat.potfile, sessions and the
# kernel cache next to hashcat.bin (verified with 8.0.0 run via a symlink).
# So it lives in a stable, user-owned ~/tools/hashcat, and an upgrade unpacks
# the new release over it: the potfile survives, because no release ships one.
#
# Replaces the old flow, which on every fresh machine fetched the latest
# release via api.github.com, copied hashcat.bin away from its data (to
# /usr/local/bin + /usr/local/share/hashcat) and then deleted
# ~/.local/share/hashcat, the directory that holds the potfile of the distro
# hashcat. Nothing here deletes user data. The distro package is left alone.

- name: hashcat - Install 7-Zip and the OpenCL runtime (ICD loader + PoCL CPU fallback)
  ansible.builtin.apt:
    name:
      - 7zip
      - ocl-icd-libopencl1
      - pocl-opencl-icd
    state: present
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - hashcat
    - network

- name: hashcat - Create ~/tools/hashcat
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ login_user }}"
    group: "{{ login_user }}"
    mode: "0755"
  loop:
    - "{{ login_home }}/tools"
    - "{{ login_home }}/tools/hashcat"
  tags:
    - hashcat
    - network

- name: hashcat - Check whether {{ hashcat_version }} is already installed
  ansible.builtin.stat:
    path: "{{ login_home }}/tools/hashcat/.installed-{{ hashcat_version }}"
  register: hashcat_marker
  tags:
    - hashcat
    - network

- name: hashcat - Download and unpack {{ hashcat_version }} (checksum verified)
  when: not hashcat_marker.stat.exists
  tags:
    - hashcat
    - network
  block:
    - name: hashcat - Download release archive
      ansible.builtin.get_url:
        url: "https://github.com/hashcat/hashcat/releases/download/v{{ hashcat_version }}/hashcat-{{ hashcat_version }}.7z"
        dest: "/tmp/hashcat-{{ hashcat_version }}.7z"
        checksum: "sha256:{{ hashcat_sha256 }}"
        mode: "0644"

    - name: hashcat - Unpack over ~/tools/hashcat (keeps hashcat.potfile, sessions)
      ansible.builtin.shell: |
        set -euo pipefail
        sz=$(command -v 7z || command -v 7zz)
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        "$sz" x -y -o"$tmp" "/tmp/hashcat-{{ hashcat_version }}.7z" >/dev/null
        cp -a "$tmp/hashcat-{{ hashcat_version }}/." "{{ login_home }}/tools/hashcat/"
        rm -f "{{ login_home }}"/tools/hashcat/.installed-*
        touch "{{ login_home }}/tools/hashcat/.installed-{{ hashcat_version }}"
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ login_user }}"

  always:
    - name: hashcat - Remove downloaded archive
      ansible.builtin.file:
        path: "/tmp/hashcat-{{ hashcat_version }}.7z"
        state: absent

- name: hashcat - Link /usr/local/bin/hashcat to the release binary
  ansible.builtin.file:
    src: "{{ login_home }}/tools/hashcat/hashcat.bin"
    dest: /usr/local/bin/hashcat
    state: link
    force: yes
  tags:
    - hashcat
    - network

- name: hashcat - Remove data copied to /usr/local/share/hashcat by older runs (never read)
  ansible.builtin.file:
    path: /usr/local/share/hashcat
    state: absent
  tags:
    - hashcat
    - network

- name: hashcat - install hashcat-utils package (Kali)
  ansible.builtin.apt:
    name: hashcat-utils
    state: latest
  when: vmware_env != "ubuntu"
  tags:
    - hashcat
    - network

- name: hashcat - install build dependencies (Ubuntu)
  ansible.builtin.apt:
    name:
      - git
      - make
      - gcc
    state: present
  when: vmware_env == "ubuntu"
  tags:
    - hashcat
    - network

- name: hashcat - clone hashcat-utils repo (Ubuntu)
  ansible.builtin.git:
    repo: https://github.com/hashcat/hashcat-utils.git
    dest: /opt/hashcat-utils
    version: master
  when: vmware_env == "ubuntu"
  tags:
    - hashcat
    - network

- name: hashcat - build hashcat-utils (Ubuntu)
  ansible.builtin.shell:
    cmd: make
    chdir: /opt/hashcat-utils
    creates: /opt/hashcat-utils/bin/cap2hccapx.bin
  when: vmware_env == "ubuntu"
  tags:
    - hashcat
    - network

- name: hashcat - find built binaries (Ubuntu)
  ansible.builtin.find:
    paths: /opt/hashcat-utils/bin
    patterns: "*.bin"
  register: hashcat_utils_binaries
  when: vmware_env == "ubuntu"
  tags:
    - hashcat
    - network

- name: hashcat - symlink hashcat-utils binaries (Ubuntu)
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "/usr/local/bin/{{ item.path | basename | regex_replace('\\.bin$', '') }}"
    state: link
  loop: "{{ hashcat_utils_binaries.files }}"
  when: vmware_env == "ubuntu"
  tags:
    - hashcat
    - network

- name: hashcat - Verify version after installation/update
  ansible.builtin.command: /usr/local/bin/hashcat --version
  register: hashcat_final_version
  changed_when: false
  failed_when: hashcat_final_version.rc != 0 or hashcat_final_version.stdout != 'v' ~ hashcat_version
  tags:
    - hashcat
    - network

- name: hashcat - Show installed version
  ansible.builtin.debug:
    msg: "{{ hashcat_final_version.stdout }}"
  when: hashcat_final_version.stdout is defined
  tags:
    - hashcat
    - network