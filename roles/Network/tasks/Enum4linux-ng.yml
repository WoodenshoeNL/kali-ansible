- name: enum4linux-ng - install package (Kali)
  ansible.builtin.apt:
    name: enum4linux-ng
    state: present
    update_cache: yes
    cache_valid_time: 3600
  when: vmware_env != "ubuntu"
  tags:
    - enum4linux-ng
    - network

- name: enum4linux-ng - install dependencies (Ubuntu)
  ansible.builtin.apt:
    name:
      - git
      - smbclient
    state: present
    update_cache: yes
    cache_valid_time: 3600
  when: vmware_env == "ubuntu"
  tags:
    - enum4linux-ng
    - network

- name: enum4linux-ng - install via uv from git (Ubuntu)
  # changed only when the tool's package versions or git commit changed
  # (--force reinstalls everything, and uv always says "Installed").
  ansible.builtin.shell: |
    set -eo pipefail
    fp() { d="$(uv tool dir)/enum4linux-ng"; { ls -d "$d"/lib/python*/site-packages/*.dist-info 2>/dev/null | xargs -rn1 basename || true; cat "$d"/lib/python*/site-packages/*.dist-info/direct_url.json 2>/dev/null || true; } | sha256sum; }
    before=$(fp)
    uv tool install --force 'enum4linux-ng @ git+https://github.com/cddmp/enum4linux-ng.git'
    [ "$before" = "$(fp)" ] || echo CHANGED
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ login_user }}"
  environment:
    PATH: "{{ login_home }}/.local/bin:{{ ansible_facts['env']['PATH'] | default('') }}"
  when: vmware_env == "ubuntu"
  register: enum4linux_ng_uv
  changed_when: "'CHANGED' in enum4linux_ng_uv.stdout"
  tags:
    - enum4linux-ng
    - network
