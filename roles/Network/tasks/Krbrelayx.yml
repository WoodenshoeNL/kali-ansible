- name: krbrelayx - clone repository
  ansible.builtin.git:
    repo: "https://github.com/dirkjanm/krbrelayx"
    dest: "{{ login_home }}/krbrelayx"
    version: HEAD
    force: yes
  become: yes
  become_user: "{{ login_user }}"
  tags:
    - krbrelayx
    - network

- name: krbrelayx - create Python virtualenv with uv
  ansible.builtin.command:
    argv:
      - uv
      - venv
      - "{{ login_home }}/krbrelayx/venv"
  become: yes
  become_user: "{{ login_user }}"
  environment:
    PATH: "{{ login_home }}/.local/bin:{{ ansible_env.PATH | default('') }}"
  args:
    creates: "{{ login_home }}/krbrelayx/venv/bin/activate"
  tags:
    - krbrelayx
    - network

- name: krbrelayx - install impacket in virtualenv with uv (provides deps)
  ansible.builtin.command:
    argv:
      - uv
      - pip
      - install
      - --python
      - "{{ login_home }}/krbrelayx/venv/bin/python"
      - --upgrade
      - impacket
  become: yes
  become_user: "{{ login_user }}"
  environment:
    PATH: "{{ login_home }}/.local/bin:{{ ansible_env.PATH | default('') }}"
  tags:
    - krbrelayx
    - network

# The scripts' shebang is `#!/usr/bin/env python`, so symlinking them ran the
# system python, never the venv with impacket: on Ubuntu (no `python`) they
# failed with "env: python: not found", on Kali they only worked through the
# distro's python3-impacket. Real wrappers run them with the venv's python.
- name: krbrelayx - remove old symlinks (copy would write through them into the repo)
  ansible.builtin.shell: |
    for t in krbrelayx addspn printerbug dnstool; do
      if [ -L "/usr/local/bin/$t" ]; then rm -f "/usr/local/bin/$t"; echo "removed $t"; fi
    done
  register: krbrelayx_old_links
  changed_when: krbrelayx_old_links.stdout | length > 0
  tags:
    - krbrelayx
    - network

- name: krbrelayx - create global wrappers in /usr/local/bin
  ansible.builtin.copy:
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      exec {{ login_home }}/krbrelayx/venv/bin/python {{ login_home }}/krbrelayx/{{ item }}.py "$@"
  loop:
    - krbrelayx
    - addspn
    - printerbug
    - dnstool
  tags:
    - krbrelayx
    - network
