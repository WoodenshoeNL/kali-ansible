# NetExec.
# - Kali: the distro package.
# - Ubuntu: uv tool install from git. NetExec releases ship no Linux asset
#   (v1.5.1 has none), so the old api.github.com lookup + binary branch never
#   matched and every run took the git fallback anyway; it is gone. The old
#   `which netexec` guard also meant it was never upgraded; it now upgrades on
#   every run like the other uv tools.

- name: netexec - Install netexec package (Kali)
  ansible.builtin.apt:
    name: netexec
    state: latest
    update_cache: yes
    cache_valid_time: 3600
  when: vmware_env != "ubuntu"
  tags:
    - netexec
    - network

- name: netexec - Install git (Ubuntu)
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: yes
    cache_valid_time: 3600
  when: vmware_env == "ubuntu"
  tags:
    - netexec
    - network

- name: netexec - Detect root-owned files in tool dir (old root-run installs)
  # Pre-become-fix installs ran uv as root, leaving root-owned files under the
  # tool dir that make later user-run upgrades fail mid-replace (broken tool).
  ansible.builtin.shell: |
    find "{{ login_home }}/.local/share/uv/tools/netexec" ! -user "{{ login_user }}" -print -quit 2>/dev/null | grep -q .
  register: netexec_root_owned
  changed_when: false
  failed_when: false
  args:
    executable: /bin/bash
  tags:
    - netexec
    - network

- name: netexec - Purge tool dir when root-owned files found
  ansible.builtin.file:
    path: "{{ login_home }}/.local/share/uv/tools/netexec"
    state: absent
  when: netexec_root_owned.rc is defined and netexec_root_owned.rc == 0
  tags:
    - netexec
    - network

- name: netexec - Install/upgrade via uv from git (Ubuntu)
  # changed only when the tool's package versions or git commit changed
  # (--force reinstalls everything, and uv always says "Installed").
  ansible.builtin.shell: |
    set -eo pipefail
    fp() { d="$(uv tool dir)/netexec"; { ls -d "$d"/lib/python*/site-packages/*.dist-info 2>/dev/null | xargs -rn1 basename || true; cat "$d"/lib/python*/site-packages/*.dist-info/direct_url.json 2>/dev/null || true; } | sha256sum; }
    before=$(fp)
    uv tool install --upgrade --force 'netexec @ git+https://github.com/Pennyw0rth/NetExec.git'
    [ "$before" = "$(fp)" ] || echo CHANGED
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ login_user }}"
  environment:
    # ~/.cargo/bin needed if aardwolf has to compile its Rust extension
    PATH: "{{ login_home }}/.local/bin:{{ login_home }}/.cargo/bin:{{ ansible_facts['env']['PATH'] | default('') }}"
  when: vmware_env == "ubuntu"
  register: netexec_uv
  changed_when: "'CHANGED' in netexec_uv.stdout"
  tags:
    - netexec
    - network

- name: netexec - Symlink netexec and nxc into /usr/local/bin (Ubuntu)
  ansible.builtin.file:
    src: "{{ login_home }}/.local/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: yes
  loop:
    - netexec
    - nxc
  when: vmware_env == "ubuntu"
  tags:
    - netexec
    - network

- name: netexec - Verify installation
  # Run as the login user: a root-run `netexec --version` writes root-owned
  # __pycache__/*.pyc into the venv, which later breaks user-run upgrades.
  # NetExec prints the version on stdout but exits 1 — accept rc 0 and 1.
  ansible.builtin.command: netexec --version
  become: yes
  become_user: "{{ login_user }}"
  register: netexec_version
  changed_when: false
  failed_when: netexec_version.rc not in [0, 1]
  tags:
    - netexec
    - network

- name: netexec - Show installed version
  ansible.builtin.debug:
    msg: "{{ netexec_version.stdout_lines[-1] | default(netexec_version.stdout) }}"
  tags:
    - netexec
    - network
