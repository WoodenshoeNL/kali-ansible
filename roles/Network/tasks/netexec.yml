# NetExec.
# - Kali: the distro package.
# - Ubuntu: uv tool install from git. NetExec releases ship no Linux asset
#   (v1.5.1 has none), so the old api.github.com lookup + binary branch never
#   matched and every run took the git fallback anyway; it is gone. The old
#   `which netexec` guard also meant it was never upgraded; it now upgrades on
#   every run like the other uv tools.

- name: netexec - Install netexec package (Kali)
  ansible.builtin.apt:
    name: netexec
    state: latest
    update_cache: yes
    cache_valid_time: 3600
  when: vmware_env != "ubuntu"
  tags:
    - netexec
    - network

- name: netexec - Install git (Ubuntu)
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: yes
    cache_valid_time: 3600
  when: vmware_env == "ubuntu"
  tags:
    - netexec
    - network

- name: netexec - Install/upgrade via uv from git (Ubuntu)
  ansible.builtin.command:
    argv:
      - uv
      - tool
      - install
      - --upgrade
      - --force
      - "netexec @ git+https://github.com/Pennyw0rth/NetExec.git"
  become: yes
  become_user: "{{ login_user }}"
  environment:
    # ~/.cargo/bin needed if aardwolf has to compile its Rust extension
    PATH: "{{ login_home }}/.local/bin:{{ login_home }}/.cargo/bin:{{ ansible_env.PATH | default('') }}"
  when: vmware_env == "ubuntu"
  tags:
    - netexec
    - network

- name: netexec - Symlink netexec and nxc into /usr/local/bin (Ubuntu)
  ansible.builtin.file:
    src: "{{ login_home }}/.local/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: yes
  loop:
    - netexec
    - nxc
  when: vmware_env == "ubuntu"
  tags:
    - netexec
    - network

- name: netexec - Verify installation
  ansible.builtin.command: netexec --version
  register: netexec_version
  changed_when: false
  tags:
    - netexec
    - network

- name: netexec - Show installed version
  ansible.builtin.debug:
    msg: "{{ netexec_version.stdout_lines[-1] | default(netexec_version.stdout) }}"
  tags:
    - netexec
    - network
