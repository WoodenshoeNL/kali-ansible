# evil-winrm-py: WinRM shell for remote Windows (with Kerberos support)
# https://github.com/adityatelange/evil-winrm-py
# Install uses uv (ensure Common role with uv runs first).

- name: evil-winrm-py - install Kerberos build prerequisites (Linux)
  ansible.builtin.apt:
    name:
      - gcc
      - python3-dev
      - libkrb5-dev
      - krb5-pkinit
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"
  tags:
    - evil-winrm-py
    - network

- name: evil-winrm-py - install/upgrade evil-winrm-py with Kerberos via uv
  become: yes
  become_user: "{{ login_user }}"
  # changed only when the tool's package versions or git commit changed
  # (--force reinstalls everything, and uv always says "Installed").
  ansible.builtin.shell: |
    set -eo pipefail
    fp() { d="$(uv tool dir)/evil-winrm-py"; { ls -d "$d"/lib/python*/site-packages/*.dist-info 2>/dev/null | xargs -rn1 basename || true; cat "$d"/lib/python*/site-packages/*.dist-info/direct_url.json 2>/dev/null || true; } | sha256sum; }
    before=$(fp)
    uv tool install --upgrade --force 'evil-winrm-py[kerberos]'
    [ "$before" = "$(fp)" ] || echo CHANGED
  args:
    executable: /bin/bash
  environment:
    PATH: "{{ login_home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
  register: evil_winrm_py_uv
  changed_when: "'CHANGED' in evil_winrm_py_uv.stdout"
  tags:
    - evil-winrm-py
    - network
