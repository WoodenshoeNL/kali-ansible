# OpenHound extension: after install the collector runs as `openhound collect sccm`.
# configmanbearpig is not installable standalone; it plugs into the openhound CLI
# via `uv tool install openhound --with configmanbearpig` (upstream Quick Start).
# Prereleases allowed per upstream instructions (openhound is pre-1.0).

- name: configmanbearpig - install/upgrade openhound with configmanbearpig via uv
  # changed only when the tool's package versions or git commit changed
  # (--force reinstalls everything, and uv always says "Installed").
  ansible.builtin.shell: |
    set -eo pipefail
    fp() { d="$(uv tool dir)/openhound"; { ls -d "$d"/lib/python*/site-packages/*.dist-info 2>/dev/null | xargs -rn1 basename || true; cat "$d"/lib/python*/site-packages/*.dist-info/direct_url.json 2>/dev/null || true; } | sha256sum; }
    before=$(fp)
    uv tool install --upgrade --force --prerelease=allow openhound --with configmanbearpig
    [ "$before" = "$(fp)" ] || echo CHANGED
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ login_user }}"
  environment:
    PATH: "{{ login_home }}/.local/bin:{{ ansible_facts['env']['PATH'] | default('') }}"
  register: configmanbearpig_uv
  changed_when: "'CHANGED' in configmanbearpig_uv.stdout"
  tags:
    - configmanbearpig
    - openhound
    - SCCM
