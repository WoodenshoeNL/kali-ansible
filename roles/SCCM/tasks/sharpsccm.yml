# SharpSCCM is a C# Windows tool; upstream ships the compiled executable in
# GitHub releases. Keep the .exe available for transfer to a Windows target
# (it does not run natively on Linux).

- name: sharpsccm - create tool directory
  ansible.builtin.file:
    path: "{{ login_home }}/SharpSCCM"
    state: directory
    owner: "{{ login_user }}"
    group: "{{ login_user }}"
    mode: "0755"
  tags:
    - sharpsccm
    - SCCM

- name: sharpsccm - download latest release executable
  ansible.builtin.get_url:
    url: https://github.com/Mayyhem/SharpSCCM/releases/latest/download/SharpSCCM.exe
    dest: "{{ login_home }}/SharpSCCM/SharpSCCM.exe"
    mode: "0644"
    force: yes
  become: yes
  become_user: "{{ login_user }}"
  tags:
    - sharpsccm
    - SCCM
